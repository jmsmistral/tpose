name: GCC build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: macos-15
            cc: gcc-15
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Both images provide Make and GNU GCC; macOS needs the versioned name.
      - name: Show toolchain
        run: |
          "$CC" --version
          make --version
      - name: Build
        run: make -j2
      - name: Test
        run: make test
      - name: Check memory access with AddressSanitizer
        run: make test-asan
      - name: Check staged installation
        run: |
          make install DESTDIR="$RUNNER_TEMP/tpose-install" PREFIX=/usr
          cmp tpose "$RUNNER_TEMP/tpose-install/usr/bin/tpose"
          make uninstall DESTDIR="$RUNNER_TEMP/tpose-install" PREFIX=/usr
          test ! -e "$RUNNER_TEMP/tpose-install/usr/bin/tpose"
